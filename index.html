<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avaliação de Fala Sintetizada</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f0f2f5;
            padding: 20px;
            line-height: 1.6;
            color: #333;
        }

        .container {
            max-width: 860px;
            margin: 0 auto;
            background: white;
            padding: 36px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }

        h1 { color: #1a1a1a; margin-bottom: 8px; text-align: center; font-size: 26px; }
        h2 { color: #1a1a1a; margin-bottom: 16px; font-size: 20px; }
        .subtitle { text-align: center; color: #666; margin-bottom: 24px; font-size: 15px; }

        .progress-container { margin-bottom: 24px; }
        .progress-info { display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 14px; color: #666; }
        .progress-bar { width: 100%; height: 10px; background: #e0e0e0; border-radius: 5px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #4CAF50, #66BB6A); transition: width 0.3s ease; border-radius: 5px; }

        .item-card {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 22px;
            border: 1px solid #e0e0e0;
            animation: fadeIn 0.3s ease-out;
        }
        .item-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .item-title { font-weight: 600; font-size: 16px; color: #333; }
        .emotion-badge { background: #ede7f6; padding: 5px 14px; border-radius: 20px; font-size: 14px; color: #4527a0; font-weight: 600; }
        .lang-badge { background: #e3f2fd; padding: 4px 12px; border-radius: 20px; font-size: 13px; color: #1976d2; font-weight: 500; margin-right: 8px; }

        audio { width: 100%; margin-top: 6px; height: 44px; }

        .question { margin-top: 16px; padding: 14px 16px; background: #fff; border-radius: 10px; border: 1px solid #e6e6e6; }
        .q-text { font-weight: 500; margin-bottom: 10px; font-size: 15px; }
        .q-text .emo { font-weight: 700; color: #4527a0; }

        .rating-group { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
        .rating-option { position: relative; flex: 1; min-width: 58px; max-width: 130px; }
        .rating-option input[type="radio"] { position: absolute; opacity: 0; }
        .rating-label {
            display: block; padding: 10px 6px; background: white; border: 2px solid #e0e0e0;
            border-radius: 10px; cursor: pointer; transition: all 0.15s; text-align: center;
            font-weight: 600; font-size: 17px; line-height: 1.2;
        }
        .rating-label small { display: block; font-size: 11px; font-weight: 500; color: #777; margin-top: 3px; }
        .rating-option input[type="radio"]:checked + .rating-label {
            background: #4CAF50; color: white; border-color: #45a049;
            transform: translateY(-2px); box-shadow: 0 4px 12px rgba(76,175,80,0.3);
        }
        .rating-option input[type="radio"]:checked + .rating-label small { color: #e8f5e9; }
        .rating-label:hover { border-color: #bdbdbd; }
        .scale-info { font-size: 12px; color: #666; margin-top: 8px; display: flex; justify-content: space-between; padding: 0 6px; }

        .pair-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 8px; }
        .pair-cell { background: #fff; border: 1px solid #e6e6e6; border-radius: 10px; padding: 12px; }
        .pair-cell .pair-name { font-weight: 700; margin-bottom: 4px; }
        .pair-choice { display: flex; gap: 12px; margin-top: 14px; }
        .choice-btn {
            flex: 1; padding: 14px; border: 2px solid #e0e0e0; border-radius: 10px; background: white;
            font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.15s; color: #333;
        }
        .choice-btn.selected { background: #4CAF50; color: white; border-color: #45a049; }
        .choice-btn:hover:not(.selected) { border-color: #bdbdbd; }

        .navigation { display: flex; justify-content: flex-end; margin-top: 28px; gap: 15px; }
        button.nav { padding: 13px 26px; border: none; border-radius: 10px; font-size: 16px; cursor: pointer; font-weight: 600; }
        .btn-next { background: #2196F3; color: white; }
        .btn-next:hover { background: #1976D2; }
        .btn-submit { background: #4CAF50; color: white; }
        .btn-submit:hover { background: #45a049; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }

        .center-screen { text-align: center; padding: 12px; }
        .center-screen p { margin-bottom: 16px; color: #555; }
        .info-list { text-align: left; max-width: 620px; margin: 22px auto; background: #f8f9fa; padding: 22px 22px 22px 40px; border-radius: 12px; }
        .info-list li { margin-bottom: 10px; color: #444; }

        .form-block { margin: 22px auto; text-align: left; max-width: 460px; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; margin-bottom: 6px; font-weight: 500; color: #444; }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%; padding: 11px 14px; font-size: 15px; border: 2px solid #e0e0e0; border-radius: 8px; background: white;
        }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline: none; border-color: #2196F3; }
        .check-group { display: flex; gap: 10px; align-items: flex-start; margin-bottom: 14px; text-align: left; }
        .check-group input { width: 18px; height: 18px; margin-top: 4px; flex-shrink: 0; }
        .check-group label { font-size: 14px; color: #444; }

        .warning { background: #fff3cd; border: 1px solid #ffeaa7; padding: 14px; border-radius: 8px; margin-bottom: 18px; color: #856404; font-size: 14px; }
        .notice { background: #e3f2fd; border: 1px solid #bbdefb; padding: 14px; border-radius: 8px; margin-bottom: 18px; color: #0d47a1; font-size: 14px; }
        .error-box { background: #ffebee; border: 1px solid #ffcdd2; padding: 14px; border-radius: 8px; margin: 14px 0; color: #b71c1c; font-size: 14px; display: none; }
        .debug-banner { background: #fce4ec; border: 1px dashed #e91e63; color: #880e4f; padding: 8px 12px; border-radius: 8px; font-size: 12px; margin-bottom: 14px; }

        .block-header { text-align: center; margin-bottom: 18px; }
        .block-header .lang-badge { font-size: 14px; }

        @media (max-width: 700px) {
            .container { padding: 20px; }
            .pair-grid { grid-template-columns: 1fr; }
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div class="container">
        <div id="debugBanner" class="debug-banner" style="display:none;"></div>
        <div class="progress-container" id="progressContainer" style="display:none;">
            <div class="progress-info">
                <span id="progressLabel"></span>
                <span id="timeEstimate"></span>
            </div>
            <div class="progress-bar"><div class="progress-fill" id="progressBar"></div></div>
        </div>
        <div id="app"><p style="text-align:center;color:#666;">Carregando…</p></div>
    </div>

    <!-- Static form so Netlify Forms detects the schema at deploy time.
         data-netlify-honeypot: sem ele o Akismet decide sozinho e classifica
         a sessão como spam a partir da ~5ª submissão (medido em 2026-08-16:
         17 das 22 etapas de uma sessão real foram para o balde de spam, com
         HTTP 200 em todas). O honeypot é o sinal documentado de "isto veio de
         um humano": o campo fica vazio no envio real e preenchido por bot. -->
    <form name="mos-eval" netlify hidden data-netlify="true" data-netlify-honeypot="bot-field">
        <input type="text" name="rater_seed" />
        <input type="text" name="kind" />
        <input type="text" name="step_id" />
        <input type="text" name="payload_json" />
        <input type="text" name="timestamp" />
        <input type="text" name="ui_version" />
        <input type="text" name="bot-field" />
    </form>

    <script>
    "use strict";

    // ================= Constantes =================
    const UI_VERSION = "3.1.0";    // protocolo v4 + identificação mínima (2026-08-24)
    const PAGE_SIZE_RATING = 10;   // máx. itens por página (blocos A/B)
    const PAGE_SIZE_ESA = 9;       // máx. pares por página (bloco ESA)
    const SEC_PER_ITEM_2Q = 16;    // item com EMOS + naturalidade
    const SEC_PER_ITEM_1Q = 12;    // item só com EMOS
    const SEC_PER_ESA_PAIR = 18;
    const EMO_PT = { angry: "raiva", happy: "alegria", sad: "tristeza", neutral: "neutro" };

    // Escala EMOS com rótulo em todos os pontos. ITU-T P.808 Anexo A.1
    // (integral à recomendação): "both 'term' and 'score' are visible for the
    // subject" e "the distance between the points should be equal". Até a v4
    // só os extremos eram nomeados, o que deixava 2-3-4 sem significado.
    const EMOS_SCALE = [
        ["1", "Não expressa"], ["2", "Expressa pouco"], ["3", "Expressa razoavelmente"],
        ["4", "Expressa bem"], ["5", "Expressa perfeitamente"],
    ];

    // Definições operacionais dos alvos (protocolo v4 §3). Descrevem o ESTADO
    // de quem fala, não uma receita acústica: listar pitch/velocidade viraria
    // caça a pista e não julgamento perceptual.
    const EMO_DEF = {
        angry: "A pessoa soa irritada, com raiva, hostil ou impaciente.",
        happy: "A pessoa soa contente, animada, alegre.",
        sad: "A pessoa soa triste, abatida, desanimada.",
    };

    const params = new URLSearchParams(location.search);
    const DEBUG = params.get("debug") === "1";

    // Recrutamento em bola de neve (decisão 2026-08-16): o link é
    // encaminhado, então não existe link individual por convidado. A seed é
    // sorteada na primeira visita e fixada no navegador; `?new=1` força uma
    // sessão nova quando duas pessoas usam o mesmo dispositivo.
    const SEED_LS_KEY = "mos-eval:assigned-seed";
    function assignSeed() {
        let s = null;
        try { s = localStorage.getItem(SEED_LS_KEY); } catch (e) { /* modo privado */ }
        if (params.get("new") === "1" || !s || !/^\d{6}$/.test(s)) {
            const buf = new Uint32Array(1);
            (window.crypto || window.msCrypto).getRandomValues(buf);
            s = String(100000 + (buf[0] % 900000));
            try { localStorage.setItem(SEED_LS_KEY, s); } catch (e) { /* ignora */ }
        }
        return s;
    }

    // ================= RNG determinístico =================
    // xmur3 (string hash) + mulberry32 (PRNG). Streams independentes por propósito:
    // rngFor(seed, "rating_pt") etc. — mesma seed => mesma sessão, sempre.
    function xmur3(str) {
        let h = 1779033703 ^ str.length;
        for (let i = 0; i < str.length; i++) {
            h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
            h = (h << 13) | (h >>> 19);
        }
        return function () {
            h = Math.imul(h ^ (h >>> 16), 2246822507);
            h = Math.imul(h ^ (h >>> 13), 3266489909);
            return (h ^= h >>> 16) >>> 0;
        };
    }
    function mulberry32(a) {
        return function () {
            a |= 0; a = (a + 0x6D2B79F5) | 0;
            let t = Math.imul(a ^ (a >>> 15), 1 | a);
            t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
    }
    function rngFor(seed, purpose) { return mulberry32(xmur3(seed + ":" + purpose)()); }
    function shuffled(arr, rng) {
        const a = [...arr];
        for (let i = a.length - 1; i > 0; i--) {
            const j = Math.floor(rng() * (i + 1));
            [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
    }

    // ================= Estado global =================
    let manifest = null;
    let raterSeed = null;      // string numérica
    let session = null;        // { steps: [...] }
    let store = null;          // estado persistido (localStorage)
    let stepIndex = 0;
    let audioStats = {};       // por passo: { itemId: {plays, played_ms} }
    let stepShownAt = null;

    const $app = document.getElementById("app");

    // ================= Persistência / retomada =================
    function storeKey() { return "mos-eval-v1:" + raterSeed; }
    function loadStore() {
        try {
            const raw = localStorage.getItem(storeKey());
            if (raw) return JSON.parse(raw);
        } catch (e) { console.warn("localStorage load failed", e); }
        return { seed: raterSeed, started_at: new Date().toISOString(), steps: {}, pending: [], finished: false };
    }
    function saveStore() {
        try { localStorage.setItem(storeKey(), JSON.stringify(store)); }
        catch (e) { console.warn("localStorage save failed", e); }
    }

    // ================= Envio (Netlify Forms) =================
    async function postForm(record) {
        const body = new URLSearchParams({
            "form-name": "mos-eval",
            rater_seed: String(record.rater_seed),
            kind: record.kind,
            step_id: record.step_id,
            payload_json: JSON.stringify(record.payload),
            timestamp: record.timestamp,
            ui_version: UI_VERSION,
            "bot-field": "",   // honeypot vazio = envio humano
        }).toString();
        const resp = await fetch("/", {
            method: "POST",
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            body,
        });
        if (!resp.ok) throw new Error("HTTP " + resp.status);
    }
    function isLocal() {
        return location.hostname === "localhost" || location.hostname === "127.0.0.1" || location.protocol === "file:";
    }
    async function submitStep(kind, stepId, payload) {
        const record = {
            rater_seed: raterSeed, kind, step_id: stepId, payload,
            timestamp: new Date().toISOString(),
        };
        store.steps[stepId] = { done: true, at: record.timestamp };
        store.pending.push(record);
        saveStore();
        await flushPending();
    }
    async function flushPending() {
        if (isLocal()) return; // teste local: mantém na fila, exporta no fim
        const still = [];
        for (const rec of store.pending) {
            try { await postForm(rec); }
            catch (e) { console.warn("submit failed, will retry", rec.step_id, e); still.push(rec); }
        }
        store.pending = still;
        saveStore();
    }
    window.addEventListener("online", () => { flushPending(); });

    function downloadBackup() {
        const data = { seed: raterSeed, ui_version: UI_VERSION, exported_at: new Date().toISOString(), store };
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url; a.download = "mos_eval_" + raterSeed + "_" + Date.now() + ".json";
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }

    // ================= Montagem determinística da sessão =================
    function chunkEven(arr, maxSize) {
        const nPages = Math.ceil(arr.length / maxSize);
        const base = Math.floor(arr.length / nPages);
        const extra = arr.length % nPages;
        const pages = [];
        let k = 0;
        for (let p = 0; p < nPages; p++) {
            const size = base + (p < extra ? 1 : 0);
            pages.push(arr.slice(k, k + size));
            k += size;
        }
        return pages;
    }

    function assembleSession() {
        const items = manifest.items;
        const byId = {};
        items.forEach((it) => { byId[it.id] = it; });

        // Âncoras de treino (protocolo v4): três cantos do espaço 2D.
        // gt_clear = teto duplo · synth_bad = off-diagonal (emoção presente,
        // naturalidade ruim) · esa_example_neu = piso de expressão (GT neutro
        // com alvo emocional informado: EMOS no piso, naturalidade no teto).
        // O último era o lado neutro do par de exemplo do ESA, que saiu do
        // núcleo e liberou o clipe. A mediana saiu: o meio das duas escalas o
        // rater interpola sozinho, então não ancorava nada.
        const TRAINING_ANCHORS = ["gt_clear", "synth_bad", "esa_example_neu"];
        const training = shuffled(
            items.filter((i) => i.block === "training" && i.active !== false &&
                                TRAINING_ANCHORS.indexOf(i.training_anchor) >= 0),
            rngFor(raterSeed, "training_order"));  // P.808 6.3.1.2: ordem randomizada,
                                                   // mesmos estímulos para todos
        const ratingPT = items.filter((i) => i.block === "rating_pt");
        const ratingEN = items.filter((i) => i.block === "rating_en");

        // Trappings de resposta instruída foram aposentados na v4 (`active:
        // false` no manifest); as sondas de conteúdo os substituem. O filtro
        // continua aqui para que um manifest antigo não os reintroduza.
        const traps = (manifest.placeholders && manifest.placeholders.trapping || [])
            .filter((t) => t.audio && t.active !== false);
        const trapsFor = (block) => traps.filter((t) => t.block === block);

        function buildBlockPages(blockName, blockItems) {
            const rng = rngFor(raterSeed, blockName);
            const order = shuffled(blockItems, rng);
            // injeta cada trapping numa posição uniforme da sequência
            for (const t of trapsFor(blockName)) {
                const pos = Math.floor(rng() * (order.length + 1));
                order.splice(pos, 0, Object.assign({ is_trapping: true }, t));
            }
            return chunkEven(order, PAGE_SIZE_RATING);
        }

        // ---- Sondas de conteúdo (protocolo v4) ----
        // A sonda pergunta qual frase foi dita no ÚLTIMO áudio da página que
        // acabou de ser enviada. O áudio já é inalcançável (página submetida
        // + retorno bloqueado), então ela mede escuta, não obediência.
        const probeCfg = manifest.content_probes || { n_pt: 0, n_en: 0, n_options: 4 };
        function buildProbes(blockName, pages, nProbes) {
            const rng = rngFor(raterSeed, "probe_" + blockName);
            const lang = blockName === "rating_pt" ? "pt" : "en";
            const pool = [];
            items.forEach((i) => {
                if (i.language === lang && i.text && i.block === blockName && pool.indexOf(i.text) < 0) pool.push(i.text);
            });
            const pageIdx = shuffled(pages.map((_, i) => i), rng).slice(0, nProbes).sort((a, b) => a - b);
            const probes = {};
            for (const pi of pageIdx) {
                const target = pages[pi][pages[pi].length - 1];
                if (!target || !target.text) continue;  // trapping legado sem texto
                const distract = shuffled(pool.filter((t) => t !== target.text), rng)
                    .slice(0, Math.max(1, (probeCfg.n_options || 4) - 1));
                probes[pi] = {
                    targetId: target.id,
                    options: shuffled([target.text].concat(distract), rng),
                };
            }
            return probes;
        }

        const ptPages = buildBlockPages("rating_pt", ratingPT);
        const enPages = buildBlockPages("rating_en", ratingEN);
        const probesFor = {
            rating_pt: buildProbes("rating_pt", ptPages, probeCfg.n_pt || 0),
            rating_en: buildProbes("rating_en", enPages, probeCfg.n_en || 0),
        };

        // Counterbalancing pré-registrado: seed par = EN→PT, ímpar = PT→EN.
        const enFirst = (BigInt(raterSeed) % 2n) === 0n;
        const blockSeq = enFirst
            ? [["rating_en", enPages], ["rating_pt", ptPages]]
            : [["rating_pt", ptPages], ["rating_en", enPages]];

        // ESA: ordem dos pares + ordem intra-par, ambas determinísticas.
        const esaRng = rngFor(raterSeed, "esa");
        const usablePairs = manifest.esa_pairs.filter((p) => p.a && p.b);
        const esaOrder = shuffled(usablePairs, esaRng).map((p) => ({ pair: p, swap: esaRng() < 0.5 }));
        const esaPages = chunkEven(esaOrder, PAGE_SIZE_ESA);

        const steps = [];
        steps.push({ id: "qual", type: "qualification" });
        steps.push({ id: "hp", type: "headphone" });
        steps.push({ id: "definitions", type: "definitions" });
        steps.push({ id: "training", type: "rating_page", block: "training", pageIndex: 0, pageCount: 1, items: training, training: true });
        blockSeq.forEach(([blockName, pages], bi) => {
            pages.forEach((pageItems, pi) => {
                steps.push({
                    id: blockName + "_p" + pi, type: "rating_page", block: blockName,
                    pageIndex: pi, pageCount: pages.length, items: pageItems,
                });
                const probe = probesFor[blockName][pi];
                if (probe) {
                    steps.push({
                        id: "probe_" + blockName + "_p" + pi, type: "probe",
                        block: blockName, targetId: probe.targetId, options: probe.options,
                    });
                }
            });
            if (bi === 0) steps.push({ id: "pause1", type: "pause" });
        });
        // ESA: contingência pré-registrada, disparada por H1-PT nulo. Fica
        // fora do núcleo (manifest.esa_enabled === false) e é religado num
        // link separado sem regerar nada.
        if (manifest.esa_enabled) {
            steps.push({ id: "esa_intro", type: "esa_intro" });
            esaPages.forEach((pagePairs, pi) => {
                steps.push({ id: "esa_p" + pi, type: "esa_page", pageIndex: pi, pageCount: esaPages.length, pairs: pagePairs });
            });
        }
        steps.push({ id: "final", type: "final" });

        return { steps, byId, enFirst };
    }

    // ================= Áudio: players + estatísticas =================
    function audioEl(itemId, src) {
        return '<audio controls preload="none" data-item="' + itemId + '"><source src="' + src + '" type="audio/wav"></audio>';
    }
    function wireAudioStats(container) {
        audioStats = {};
        container.querySelectorAll("audio[data-item]").forEach((el) => {
            const id = el.dataset.item;
            audioStats[id] = audioStats[id] || { plays: 0, played_ms: 0, _t0: null };
            el.addEventListener("play", () => { audioStats[id]._t0 = Date.now(); });
            const stop = () => {
                if (audioStats[id]._t0) {
                    audioStats[id].played_ms += Date.now() - audioStats[id]._t0;
                    audioStats[id]._t0 = null;
                }
            };
            el.addEventListener("pause", stop);
            el.addEventListener("ended", () => { stop(); audioStats[id].plays += 1; });
            // um áudio por vez
            el.addEventListener("play", () => {
                container.querySelectorAll("audio").forEach((other) => { if (other !== el) other.pause(); });
            });
        });
    }
    function statsFor(id) {
        const s = audioStats[id] || { plays: 0, played_ms: 0 };
        return { plays: s.plays, played_ms: Math.round(s.played_ms) };
    }

    // ================= Renderização =================
    function render() {
        const step = session.steps[stepIndex];
        stepShownAt = new Date().toISOString();
        updateProgress();
        window.scrollTo(0, 0);
        const renderers = {
            qualification: renderQualification,
            headphone: renderHeadphone,
            definitions: renderDefinitions,
            rating_page: renderRatingPage,
            probe: renderProbe,
            pause: renderPause,
            esa_intro: renderEsaIntro,
            esa_page: renderEsaPage,
            final: renderFinal,
        };
        renderers[step.type](step);
        wireAudioStats($app);
    }

    function updateProgress() {
        const total = session.steps.length;
        const pc = document.getElementById("progressContainer");
        pc.style.display = stepIndex > 0 ? "block" : "none";
        document.getElementById("progressLabel").textContent = "Etapa " + (stepIndex + 1) + " de " + total;
        document.getElementById("progressBar").style.width = ((stepIndex) / (total - 1)) * 100 + "%";
        // estimativa grosseira do tempo restante
        let secs = 0;
        for (let i = stepIndex; i < session.steps.length; i++) {
            const s = session.steps[i];
            if (s.type === "rating_page") {
                secs += s.items.reduce((t, it) =>
                    t + (it.ask_naturalness !== false ? SEC_PER_ITEM_2Q : SEC_PER_ITEM_1Q), 0);
            } else if (s.type === "esa_page") secs += s.pairs.length * SEC_PER_ESA_PAIR;
            else if (s.type === "probe") secs += 15;
            else secs += 60;
        }
        document.getElementById("timeEstimate").textContent = "~" + Math.max(1, Math.round(secs / 60)) + " min restantes";
    }

                emoLegend();

            html += "<details style='margin:0 0 14px;'><summary style='cursor:pointer;color:#4527a0;'>Rever as definições das emoções</summary>" +
                emoLegend() + "</details>";
        }
        step.items.forEach((it, idx) => {
            // `training_target_emotion` sobrepõe o alvo só no treino: a âncora
            // de piso é um clipe neutro, e o alvo informado precisa ser uma
            // emoção que fala neutra claramente NÃO expressa.
            const emoKey = (step.training && it.training_target_emotion) || it.target_emotion;
            const emo = EMO_PT[emoKey] || emoKey;
            // Naturalidade só nas utterances sorteadas (protocolo v4 §2). O
            // manifest decide, e as duas condições de uma utterance entram ou

                      ratingRadios("nat_" + it.id, [["1", "Péssima"], ["2", "Ruim"], ["3", "Regular"], ["4", "Boa"], ["5", "Excelente"]]) +
                      "</div>"
                    : "") +
                "</div>";

            '<div class="navigation"><button class="nav btn-next" onclick="window.submitRatingPage()">Enviar página e continuar</button></div>';

                '<div class="item-header"><div class="item-title">Par ' + (idx + 1) + " de " + step.pairs.length + "</div>" +
                '<div class="emotion-badge">Emoção: ' + emo + "</div></div>" +
                '<div class="q-text" style="margin-bottom:8px;">Qual das duas transmite melhor <span class="emo">' + emo + "</span>?</div>" +
                '<div class="pair-grid">' +
                '<div class="pair-cell"><div class="pair-name">Áudio A</div>' + audioEl(A.id, A.audio) + "</div>" +
                '<div class="pair-cell"><div class="pair-name">Áudio B</div>' + audioEl(B.id, B.audio) + "</div>" +
                "</div>" +
                '<div class="pair-choice">' +
                '<button class="choice-btn" data-choice="first" onclick="window.pickPair(this)">Áudio A</button>' +
                '<button class="choice-btn" data-choice="second" onclick="window.pickPair(this)">Áudio B</button>' +
                "</div></div>";
        });
        html += '<div class="error-box" id="errorBox"></div>' +
            '<div class="navigation"><button class="nav btn-next" onclick="window.submitEsaPage()">Enviar página e continuar</button></div>';
        $app.innerHTML = html;
    }
    window.pickPair = function (btn) {
        const card = btn.closest(".item-card");
        card.querySelectorAll(".choice-btn").forEach((b) => b.classList.remove("selected"));
        btn.classList.add("selected");
    };
    window.submitEsaPage = async function () {
        const step = session.steps[stepIndex];
        const recs = [];
        for (let i = 0; i < step.pairs.length; i++) {
            const entry = step.pairs[i];
            const p = entry.pair;
            const card = $app.querySelector('.item-card[data-pair="' + p.pair_id + '"]');
            const sel = card.querySelector(".choice-btn.selected");
            const firstId = entry.swap ? p.b : p.a;
            const secondId = entry.swap ? p.a : p.b;
            const stA = statsFor(firstId), stB = statsFor(secondId);
            if (!sel && !DEBUG) return showError("Escolha um áudio no par " + (i + 1) + ".");
            if ((stA.plays < 1 || stB.plays < 1) && !DEBUG) return showError("Ouça os dois áudios do par " + (i + 1) + " até o fim.");
            const chosenId = sel ? (sel.dataset.choice === "first" ? firstId : secondId) : null;
            recs.push({
                pair_id: p.pair_id, a: p.a, b: p.b, first_shown: firstId, chosen: chosenId,
                first_audio: stA, second_audio: stB,
            });
        }
        await submitStep("esa_page", step.id, {
            page_index: step.pageIndex, counts: true,
            shown_at: stepShownAt, submitted_at: new Date().toISOString(),
            min_audio_s: Math.round(step.pairs.reduce((s, e) => {
                const a = session.byId[e.pair.a], b = session.byId[e.pair.b];
                return s + (a ? a.duration_s : 0) + (b ? b.duration_s : 0);
            }, 0) * 10) / 10,
            pairs: recs, debug: DEBUG,
        });
        advance();
    };

    // ---------- Tela: encerramento ----------
    function renderFinal() {
        if (store.finished) { renderThanks(); return; }
        $app.innerHTML =
            '<div class="center-screen"><h1>Última etapa!</h1>' +
            "<p>Se quiser, deixe um comentário livre (algo que chamou atenção, dificuldade, sugestão):</p>" +
            '<div class="form-block"><div class="form-group"><textarea id="finalComments" rows="4" placeholder="Opcional"></textarea></div></div>' +
            '<div class="error-box" id="errorBox"></div>' +
            '<div class="navigation" style="justify-content:center;"><button class="nav btn-submit" onclick="window.submitFinal()">Concluir avaliação</button></div></div>';
    }
    window.submitFinal = async function () {
        const code = "MOS-" + raterSeed + "-" + Date.now().toString(36).toUpperCase();
        store.confirmationCode = code;
        await submitStep("final", "final", {
            shown_at: stepShownAt, submitted_at: new Date().toISOString(),
            comments: (document.getElementById("finalComments").value || "").trim() || null,
            confirmation_code: code, started_at: store.started_at,
            steps_completed: Object.keys(store.steps).length, debug: DEBUG,
        });
        store.finished = true;
        saveStore();
        renderThanks();
    };
    function renderThanks() {
        const pendingN = store.pending.length;
        $app.innerHTML =
            '<div class="center-screen"><h1>Avaliação concluída! 🎉</h1>' +
            '<p style="font-size:18px;color:#4CAF50;">✅ Muito obrigado pela sua participação.</p>' +
            '<div class="warning" style="margin-top:24px;text-align:left;"><strong>Código de confirmação:</strong> ' + (store.confirmationCode || "-") + "<br>Anote este código como comprovante de participação.</div>" +
            (pendingN > 0
                ? '<div class="error-box" style="display:block;text-align:left;">' + pendingN + ' respostas ainda não foram enviadas ao servidor (sem conexão?). <strong>Não feche esta aba:</strong> tente novamente ou baixe o backup e envie ao pesquisador.<br><br><button class="nav btn-next" onclick="window.retryPending()">Tentar reenviar</button> <button class="nav btn-submit" onclick="window.doBackup()">Baixar backup (JSON)</button></div>'
                : "") +
            (isLocal() ? '<div class="notice" style="text-align:left;">Execução local: os dados não foram enviados. <button class="nav btn-submit" onclick="window.doBackup()">Baixar JSON</button></div>' : "") +
            "</div>";
        document.getElementById("progressContainer").style.display = "none";
    }
    window.retryPending = async function () { await flushPending(); renderThanks(); };
    window.doBackup = function () { downloadBackup(); };

    // ================= Boot =================
    async function boot() {
        const r = params.get("r");
        if (!r || !/^\d+$/.test(r) || params.get("new") === "1") {
            // sem código no link: sorteia um e recarrega já com ele no URL,
            // para que a sessão continue reproduzível a partir da barra de
            // endereço (randomização, contrabalanceamento e retomada).
            const s = assignSeed();
            location.replace("?r=" + s + (DEBUG ? "&debug=1" : ""));
            return;
        }
        raterSeed = r;

        try {
            const resp = await fetch("manifest.json");
            manifest = await resp.json();
        } catch (e) {
            $app.innerHTML = '<div class="warning">Erro ao carregar os dados do teste. Recarregue a página; se persistir, avise o pesquisador.</div>';
            return;
        }

        store = loadStore();
        saveStore();
        session = assembleSession();
        // Áudio de ajuste de volume no check de fones. Usa a antiga âncora
        // mediana, que saiu do treino na v4 e por isso não é mais estímulo de
        // nada: bom material de referência, sem dupla função.
        const median = manifest.items.find((i) => i.training_anchor === "synth_median") || manifest.items[0];
        session.volumeAdjustSrc = median.audio;

        if (DEBUG) {
            const db = document.getElementById("debugBanner");
            db.style.display = "block";
            db.textContent = "DEBUG · seed " + raterSeed + " · ordem " + (session.enFirst ? "EN→PT" : "PT→EN") +
                " · " + session.steps.length + " etapas (validações de áudio desativadas; payloads marcados debug=true)";
        }

        // Retomada: primeiro passo ainda não concluído
        stepIndex = 0;
        for (let i = 0; i < session.steps.length; i++) {
            if (store.steps[session.steps[i].id] && store.steps[session.steps[i].id].done) stepIndex = i + 1;
            else break;
        }
        if (store.finished || stepIndex >= session.steps.length) { stepIndex = session.steps.length - 1; store.finished = true; renderThanks(); return; }
        if (stepIndex > 0) {
            const cont = session.steps[stepIndex];
            $app.innerHTML = '<div class="center-screen"><h1>Bem-vindo(a) de volta!</h1>' +
                "<p>Encontramos seu progresso salvo neste navegador. Você continuará de onde parou (etapa " + (stepIndex + 1) + " de " + session.steps.length + ").</p>" +
                '<div class="navigation" style="justify-content:center;"><button class="nav btn-next" onclick="window.resumeNow()">Continuar</button></div></div>';
            window.resumeNow = function () { render(); };
            flushPending();
            return;
        }
        render();
    }

    window.addEventListener("beforeunload", (e) => {
        if (store && !store.finished && stepIndex > 0) { e.preventDefault(); e.returnValue = ""; }
    });

    // Bloqueio de retorno (protocolo v4): a sonda de conteúdo só vale se o
    // áudio anterior estiver inalcançável. A página já é submetida por vez,
    // mas o botão "voltar" do navegador reexibiria a anterior.
    window.addEventListener("popstate", () => {
        history.pushState(null, "", location.href);
        if (session && !(store && store.finished)) {
            showError("Não é possível voltar: as respostas da página anterior já foram enviadas.");
        }
    });
    history.pushState(null, "", location.href);

    boot();
    </script>
</body>
</html>
